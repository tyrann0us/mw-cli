name: 'Docs'
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/docs.php'
      - '.github/workflows/docs.yml'
  # Builds on pull requests too, so a broken generator shows up before the merge.
  pull_request:
    paths:
      - 'src/**'
      - 'tools/docs.php'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 'Build the command reference'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - run: php tools/docs.php build/docs
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
      - uses: actions/jekyll-build-pages@v1
        with:
          source: build/docs
          destination: build/site
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: build/site
  deploy:
    name: 'Deploy to GitHub Pages'
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
