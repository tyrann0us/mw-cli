coverage:
  status:
    project:
      default:
        # `auto` uses the base branch's coverage as the floor on every
        # PR. Unit and Behat coverage together must stay at 100%.
        target: auto
        threshold: 0%
        if_ci_failed: error
    patch:
      default:
        # New code must be fully covered.
        target: 100%
        threshold: 0%
